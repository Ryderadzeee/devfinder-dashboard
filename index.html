<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevFinder Dashboard | GitHub REST API Explorer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div>
        <h1>DevFinder</h1>
        <p class="subtitle">GitHub Profile &amp; Repository Analytics via REST API</p>
      </div>
      <form id="search-form" class="search-bar">
        <input type="text" id="username-input" placeholder="Enter GitHub username (e.g. Ryderadzeee)..." value="Ryderadzeee" required />
        <button type="submit">Search</button>
      </form>
    </header>

    <div id="status-message" class="status-message hidden"></div>

    <section id="profile-card" class="profile-card hidden"></section>

    <section id="repos-section" class="repos-section hidden">
      <div class="repos-header">
        <h2>Public Repositories</h2>
        <div class="repo-controls">
          <input type="search" id="repo-filter" placeholder="Filter repositories..." />
          <select id="language-filter">
            <option value="ALL">All Languages</option>
          </select>
        </div>
      </div>
      <div id="repos-grid" class="repos-grid"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
